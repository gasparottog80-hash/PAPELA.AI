services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papela
      POSTGRES_PASSWORD: papela
      POSTGRES_DB: papela
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papela"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
