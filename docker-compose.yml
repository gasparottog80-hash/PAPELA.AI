x-app-env: &app-env
  # Inside the compose network the DB host is `postgres:5432`. The host-side
  # 5433 mapping below is only for local dev tools on your machine.
  PAPELA_DATABASE_URL: postgresql://papela:papela@postgres:5432/papela
  PAPELA_API_KEYS: ${PAPELA_API_KEYS:-dev-key-change-me}
  PAPELA_OCR_ENGINE: ${PAPELA_OCR_ENGINE:-fake}
  PAPELA_ENV: ${PAPELA_ENV:-development}
  PAPELA_LOG_LEVEL: ${PAPELA_LOG_LEVEL:-INFO}
  PAPELA_STORAGE_DIR: /data/pdfs
  PAPELA_ERASURE_DIR: /data/erasures
  PAPELA_RETENTION_DAYS: ${PAPELA_RETENTION_DAYS:-7}
  PAPELA_JOB_RETENTION_DAYS: ${PAPELA_JOB_RETENTION_DAYS:-30}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papela
      POSTGRES_PASSWORD: papela
      POSTGRES_DB: papela
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papela"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8077:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - papela_pdfs:/data/pdfs
      - papela_erasures:/data/erasures
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      # purge-after-done is ON by default (see app/config.py). To KEEP raw PDFs
      # on disk (dev/inspection only) set PAPELA_PURGE_AFTER_DONE=false.
      PAPELA_PURGE_AFTER_DONE: ${PAPELA_PURGE_AFTER_DONE:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Shared with the API: API writes PDFs here, worker reads + purges them.
      - papela_pdfs:/data/pdfs
      - papela_erasures:/data/erasures

volumes:
  pgdata:
  papela_pdfs:
  papela_erasures:
