[project]
name = "papela-ai"
version = "0.1.0"
description = "PAPELA.AI - on-premise fiscal-document OCR pipeline (PaddleOCR + Postgres)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.12",
    # Proprietary fiscal-field extraction core. Private, not on PyPI. PEP 508
    # direct Git reference (not [tool.uv.sources]) so plain `pip install .`
    # resolves it too, not just `uv`. The release tag is annotated; uv.lock
    # pins its peeled commit. Use uv sync --locked for reproducible installs.
    # Not part of this repository (see README).
    "papela-fiscal-extractor @ git+ssh://git@github.com/gasparottog80-hash/papela-fiscal-extractor.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
]
# Heavy OCR runtime deps, installed only where the worker actually runs OCR.
# Pinned to the PaddleOCR 2.x line: PPStructure API + numpy<2 (paddle 2.x is
# not compatible with numpy 2). PP-Structure needs these for table recognition.
ocr = [
    "paddleocr>=2.7,<2.10",
    "paddlepaddle>=2.5,<3",
    "pymupdf>=1.24",
    "numpy>=1.24,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = "graphify-out"

[[tool.mypy.overrides]]
module = ["fitz", "numpy", "paddleocr", "papela_fiscal_extractor"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Required because `dependencies` above includes a PEP 508 direct reference
# (the private Git dependency). Hatchling refuses to build otherwise, to stop
# a package with direct references from being accidentally published to
# PyPI. papela-ai is an application, never published to PyPI, so this is safe.
[tool.hatch.metadata]
allow-direct-references = true
