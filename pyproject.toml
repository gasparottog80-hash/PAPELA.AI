[project]
name = "papela-ai"
version = "0.1.0"
description = "PAPELA.AI - on-premise fiscal-document OCR pipeline (PaddleOCR + Postgres)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pypdf>=5.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]
# Heavy OCR runtime deps, installed only where the worker actually runs OCR.
ocr = [
    "paddleocr>=2.9",
    "paddlepaddle>=2.6",
    "pymupdf>=1.24",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
