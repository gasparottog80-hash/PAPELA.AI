name: Reproducible baseline

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_CACHE: '1'
      PAPELA_ENV: test
      PAPELA_DATABASE_URL: postgresql://gate1:gate1-test-only@127.0.0.1:55433/gate1
      PAPELA_API_KEYS: test-key
      PAPELA_TENANT_API_KEYS: '{"22222222-2222-4222-8222-222222222222":"gate1-synthetic-b-key"}'
      PAPELA_OCR_ENGINE: fake
      PAPELA_STORAGE_DIR: ./data/ci-uploads
      PAPELA_ERASURE_DIR: /tmp/papela-gate8-pytest-erasures
      PAPELA_PURGE_AFTER_DONE: 'false'
      PAPELA_PROJECT_NAME: papela-gate4-ci
      PAPELA_DOMAIN: localhost
      PAPELA_APP_IMAGE: papelaai-gate3-revalidated
      PAPELA_MAX_STORAGE_BYTES: '536870912'
      PAPELA_HTTP_BIND: 127.0.0.1
      PAPELA_HTTP_PORT: '18080'
      PAPELA_HTTPS_BIND: 127.0.0.1
      PAPELA_HTTPS_PORT: '18443'
    steps:
      # Do not replace this with pull_request_target to expose private source.
      - name: Require a trusted repository event
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$IS_FORK" == "true" || "$ACTOR" == "dependabot[bot]" ]]; then
            echo '::error::Private baseline cannot run on fork or Dependabot PRs. Maintainer review is required.'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.12'
          enable-cache: false

      - name: Load exclusive read-only extractor key into an ephemeral agent
        env:
          CI_DEPLOY_KEY: ${{ secrets.PAPELA_EXTRACTOR_CI_SSH_KEY }}
        run: |
          if [[ -z "$CI_DEPLOY_KEY" ]]; then
            echo '::error::Configure PAPELA_EXTRACTOR_CI_SSH_KEY with the exclusive read-only deploy key. No fallback key is allowed.'
            exit 1
          fi
          actual=$(ssh-keygen -lf .github/ssh_known_hosts -E sha256 | awk '{print $2}')
          [[ "$actual" == 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU' ]]
          eval "$(ssh-agent -a "$RUNNER_TEMP/papela-ci-agent.sock" -s)" >/dev/null
          # Publish coordinates before ssh-add so failure still triggers cleanup.
          printf 'SSH_AUTH_SOCK=%s\nSSH_AGENT_PID=%s\n' "$SSH_AUTH_SOCK" "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$CI_DEPLOY_KEY" | ssh-add -t 1800 - >/dev/null 2>&1
          # Validate the dedicated v2 identity, not a personal/compromised key.
          [[ "$(ssh-add -l -E sha256 | awk '{print $2}')" == 'SHA256:SwxgjtF6Mzjf2/Bh7/5EfJmMR5Xiu8XlwYSRqnaUx7U' ]]
          printf 'GIT_SSH_COMMAND=ssh -F /dev/null -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=%s/.github/ssh_known_hosts -o GlobalKnownHostsFile=/dev/null\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Validate lock and install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --extra dev
          uv run --no-sync python scripts/verify_extractor.py

      - name: Fresh Docker build with BuildKit SSH forwarding
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build --no-cache --ssh "default=$SSH_AUTH_SOCK" \
            --build-arg "RELEASE_COMMIT=$GITHUB_SHA" \
            --tag papelaai-gate3-revalidated --tag "papelaai:sha-$GITHUB_SHA" .
          docker run --rm --network none papelaai-gate3-revalidated python scripts/verify_extractor.py

      - name: Build previous reviewed commit for isolated rollback drill
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          previous=899ea468fa121e74788d253092f95dd4637bf429
          git merge-base --is-ancestor "$previous" HEAD
          [[ "$previous" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/papela-gate7-previous"
          git archive "$previous" | tar -x -C "$RUNNER_TEMP/papela-gate7-previous"
          docker build --no-cache --ssh "default=$SSH_AUTH_SOCK" \
            --tag papelaai:gate7-previous-base "$RUNNER_TEMP/papela-gate7-previous"
          docker build --no-cache -f ops/Dockerfile.synthetic-label \
            --build-arg BASE_IMAGE=papelaai:gate7-previous-base \
            --build-arg "RELEASE_COMMIT=$previous" \
            --tag "papelaai:sha-$previous" .
          docker run --rm --network none "papelaai:sha-$previous" \
            python scripts/verify_extractor.py

      - name: Remove automation key from agent
        if: ${{ always() }}
        run: |
          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-add -D >/dev/null 2>&1 || true
            ssh-agent -k >/dev/null
          fi

      # No agent credential remains while test/application scripts execute.
      - name: Scan the final runtime image without publishing it
        run: |
          docker save --output "$RUNNER_TEMP/papela-gate3-runtime.tar" papelaai-gate3-revalidated
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP,target=/scan" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/papela-gate3-runtime.tar \
            --cache-dir /scan/trivy-cache --scanners vuln,secret \
            --severity CRITICAL,HIGH --format json \
            --output /scan/papela-gate3-scan.json --timeout 5m --quiet
          python - "$RUNNER_TEMP/papela-gate3-scan.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          results = report.get("Results") or []
          assert results, "Image scan produced no targets"
          severe = sum(
              v.get("Severity") in {"CRITICAL", "HIGH"}
              for result in results
              for v in (result.get("Vulnerabilities") or [])
          )
          secrets = sum(len(result.get("Secrets") or []) for result in results)
          assert not severe and not secrets, (
              f"Runtime scan blocked: {severe} severe advisories, "
              f"{secrets} secret findings"
          )
          print("Runtime scan PASS: zero CRITICAL/HIGH and zero secret findings")
          PY

      - name: Lint and typecheck
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy app

      - name: Validate Compose and start isolated test database
        run: |
          docker compose config --quiet
          docker compose -f compose.gate1.yml config --quiet
          docker compose -f compose.gate1.yml up --detach --wait --wait-timeout 90 postgres
          uv run --no-sync python -c 'import os, psycopg; psycopg.connect(os.environ["PAPELA_DATABASE_URL"], connect_timeout=5).close()'

      - name: Unit and integration tests (no skipped tests allowed)
        run: |
          uv run --no-sync pytest --junitxml="$RUNNER_TEMP/pytest.xml"
          uv run --no-sync python - "$RUNNER_TEMP/pytest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter('testcase'))
          assert cases, 'No tests executed'
          assert not list(root.iter('skipped')), 'Skipped tests invalidate the baseline'
          assert not list(root.iter('failure')), 'Test failures invalidate the baseline'
          assert not list(root.iter('error')), 'Test errors invalidate the baseline'
          print(f'Test report PASS: {len(cases)} tests, zero skips/errors/failures')
          PY

      - name: Build application distributions
        run: uv build

      - name: Scan public source for committed secrets
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/scan" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners secret --skip-dirs /src/.git --skip-dirs /src/.venv \
            --skip-dirs /src/data --format json --output /scan/repo-secrets.json \
            --quiet /src
          python - "$RUNNER_TEMP/repo-secrets.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          findings = sum(
              len(result.get("Secrets") or [])
              for result in (report.get("Results") or [])
          )
          assert findings == 0, f"Public source secret scan blocked: {findings}"
          print("Public source secret scan PASS: zero findings")
          PY
          rm -f "$RUNNER_TEMP/repo-secrets.json"

      - name: Smoke E2E against the freshly built API and worker
        run: |
          trap 'docker compose -f compose.gate1.yml logs --no-color --tail=100 api worker' ERR
          docker compose -f compose.gate1.yml up --detach --wait --wait-timeout 90 api worker
          uv run --no-sync python scripts/smoke_ci.py
          uv run --no-sync python scripts/smoke_security.py
          git diff --exit-code -- pyproject.toml uv.lock
          git diff --check

      # These tests advance the shared synthetic DB privacy generation. Run
      # them after the smoke, which boots with its own fresh journal volume.
      - name: Gate 8 synthetic journal compaction and restore-floor regression
        run: |
          uv run --no-sync pytest -q tests/test_lifecycle.py -k compaction

      - name: Gate 4 production topology with synthetic credentials
        run: |
          export PAPELA_PG_ADMIN_PASSWORD_FILE="$RUNNER_TEMP/papela-gate4-secrets/pg_admin_password"
          export PAPELA_PG_RUNTIME_PASSWORD_FILE="$RUNNER_TEMP/papela-gate4-secrets/pg_runtime_password"
          export PAPELA_DATABASE_URL_FILE="$RUNNER_TEMP/papela-gate4-secrets/app_database_url"
          export PAPELA_TENANT_API_KEYS_FILE="$RUNNER_TEMP/papela-gate4-secrets/tenant_api_keys"
          export PAPELA_BACKUP_DIR="$RUNNER_TEMP/papela-gate6-backups"
          export PAPELA_ERASURE_DIR="$RUNNER_TEMP/papela-gate8-erasures"
          printf 'PAPELA_PG_ADMIN_PASSWORD_FILE=%s\nPAPELA_PG_RUNTIME_PASSWORD_FILE=%s\nPAPELA_DATABASE_URL_FILE=%s\nPAPELA_TENANT_API_KEYS_FILE=%s\nPAPELA_BACKUP_DIR=%s\nPAPELA_ERASURE_DIR=%s\n' \
            "$PAPELA_PG_ADMIN_PASSWORD_FILE" "$PAPELA_PG_RUNTIME_PASSWORD_FILE" \
            "$PAPELA_DATABASE_URL_FILE" "$PAPELA_TENANT_API_KEYS_FILE" \
            "$PAPELA_BACKUP_DIR" "$PAPELA_ERASURE_DIR" >> "$GITHUB_ENV"
          install -d -m 700 "$RUNNER_TEMP/papela-gate4-secrets"
          install -d -m 700 "$PAPELA_BACKUP_DIR"
          install -d -m 700 "$PAPELA_ERASURE_DIR"
          uv run --no-sync python -c 'from app.erasure import ErasureJournal; import os; ErasureJournal.initialize(os.environ["PAPELA_ERASURE_DIR"])'
          sudo chown -R 65532:65532 "$PAPELA_ERASURE_DIR"
          sudo chown 70:70 "$PAPELA_BACKUP_DIR"
          admin_password=$(openssl rand -hex 24)
          runtime_password=$(openssl rand -hex 24)
          printf '%s' "$admin_password" > "$PAPELA_PG_ADMIN_PASSWORD_FILE"
          printf '%s' "$runtime_password" > "$PAPELA_PG_RUNTIME_PASSWORD_FILE"
          printf 'postgresql://papela_runtime:%s@postgres:5432/papela' "$runtime_password" > "$PAPELA_DATABASE_URL_FILE"
          unset admin_password runtime_password
          printf '%s' '{"11111111-1111-4111-8111-111111111111":"gate4-synthetic-tenant-key-11111111111111111111111111","22222222-2222-4222-8222-222222222222":"gate4-synthetic-tenant-key-22222222222222222222222222","33333333-3333-4333-8333-333333333333":"gate8-synthetic-tenant-key-33333333333333333333333333"}' > "$PAPELA_TENANT_API_KEYS_FILE"
          # File-backed Compose secrets preserve host UID/mode on Linux;
          # non-root containers cannot read root-owned 0600 files.
          sudo chown 70:70 "$PAPELA_PG_ADMIN_PASSWORD_FILE" "$PAPELA_PG_RUNTIME_PASSWORD_FILE"
          sudo chown 65532:65532 "$PAPELA_DATABASE_URL_FILE" "$PAPELA_TENANT_API_KEYS_FILE"
          sudo chmod 400 "$PAPELA_PG_ADMIN_PASSWORD_FILE" "$PAPELA_PG_RUNTIME_PASSWORD_FILE" "$PAPELA_DATABASE_URL_FILE" "$PAPELA_TENANT_API_KEYS_FILE"
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml build caddy migrate postgres backup
          # Scan each final Gate 4 runtime before starting the synthetic stack.
          # No image or scan report is uploaded: they may reveal private code.
          for component in caddy migrate postgres backup; do
            tag=gate4
            [[ "$component" == backup ]] && tag=gate6
            image="papela-${component}:${tag}"
            docker save --output "$RUNNER_TEMP/${component}-gate4.tar" "$image"
            docker run --rm \
              --mount "type=bind,source=$RUNNER_TEMP,target=/scan" \
              aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --input "/scan/${component}-gate4.tar" \
              --cache-dir /scan/trivy-cache --scanners vuln,secret \
              --severity CRITICAL,HIGH --format json \
              --output "/scan/${component}-gate4-scan.json" --timeout 5m --quiet
            python - "$RUNNER_TEMP/${component}-gate4-scan.json" "$component" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          results = report.get("Results") or []
          assert results, f"{sys.argv[2]} scan produced no targets"
          severe = sum(
              finding.get("Severity") in {"CRITICAL", "HIGH"}
              for result in results
              for finding in (result.get("Vulnerabilities") or [])
          )
          secrets = sum(len(result.get("Secrets") or []) for result in results)
          assert severe == 0 and secrets == 0, (
              f"{sys.argv[2]} scan blocked: {severe} severe advisories, "
              f"{secrets} secret findings"
          )
          print(f"{sys.argv[2]} scan PASS: zero CRITICAL/HIGH and zero secrets")
          PY
            rm -f "$RUNNER_TEMP/${component}-gate4.tar" "$RUNNER_TEMP/${component}-gate4-scan.json"
          done
          docker compose -f docker-compose.prod.yml up --detach --wait --wait-timeout 120 postgres
          docker compose -f docker-compose.prod.yml --profile ops run --rm migrate
          docker compose -f docker-compose.prod.yml --profile ops run --rm migrate
          docker compose -f docker-compose.prod.yml up --detach --wait --wait-timeout 120 api worker caddy
          docker cp papela-gate4-ci-caddy-1:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/papela-gate4-root.crt"
          job_id=$(uv run --no-sync python scripts/smoke_production_local.py before --port 18443 --ca "$RUNNER_TEMP/papela-gate4-root.crt" | sed -n 's/^PRE_RESTART_JOB_ID=//p')
          test -n "$job_id"
          docker compose -f docker-compose.prod.yml restart postgres api worker caddy
          docker compose -f docker-compose.prod.yml up --detach --wait --wait-timeout 120 api worker caddy
          uv run --no-sync python scripts/smoke_production_local.py after --port 18443 --ca "$RUNNER_TEMP/papela-gate4-root.crt" --job-id "$job_id"
          # The Prometheus text endpoints exist only on each container's
          # loopback interface; neither Compose nor Caddy publishes port 9100.
          docker exec papela-gate4-ci-api-1 python -c 'import re,urllib.request; body=urllib.request.urlopen("http://127.0.0.1:9100/metrics", timeout=3).read().decode(); assert re.search(r"^jobs_created_total [1-9]", body, re.M) and "requests_total" in body'
          docker exec papela-gate4-ci-worker-1 python -c 'import re,urllib.request; body=urllib.request.urlopen("http://127.0.0.1:9100/metrics", timeout=3).read().decode(); assert re.search(r"^jobs_completed_total [1-9]", body, re.M) and re.search(r"^worker_heartbeat_age_seconds [0-9]", body, re.M)'
          uv run --no-sync python - "$RUNNER_TEMP/papela-gate4-root.crt" <<'PY'
          import httpx
          import sys
          with httpx.Client(verify=sys.argv[1], trust_env=False) as client:
              response = client.get(
                  "https://localhost:18443/health?token=gate5-ci-canary",
                  headers={"Authorization": "gate5-ci-canary"},
              )
              assert response.status_code == 200
          PY
          if docker logs papela-gate4-ci-caddy-1 2>&1 | grep -q 'gate5-ci-canary'; then
            echo '::error::Sensitive canary appeared in Caddy logs'
            exit 1
          fi
          if docker exec papela-gate4-ci-postgres-1 psql -X -q -U papela_owner -d papela -c 'SELECT gate5_pg_canary_nonexistent' >/dev/null 2>&1; then
            echo '::error::Expected synthetic SQL failure did not occur'
            exit 1
          fi
          if docker logs papela-gate4-ci-postgres-1 2>&1 | grep -q 'gate5_pg_canary_nonexistent'; then
            echo '::error::Sensitive SQL canary appeared in Postgres logs'
            exit 1
          fi

      - name: Gate 7 isolated A to B to A deploy and rollback drill
        run: |
          uv run --no-sync python -m scripts.smoke_deploy_rollback \
            --previous-commit 899ea468fa121e74788d253092f95dd4637bf429 \
            --target-commit "$GITHUB_SHA" \
            --state-dir "$RUNNER_TEMP/papela-gate7-drill" \
            --project papela-gate7-ci

      - name: Gate 6 isolated backup and destructive restore test
        run: |
          uv run --no-sync python scripts/smoke_backup_restore.py seed \
            --state "$RUNNER_TEMP/gate6-jobs.json" --port 18443 \
            --ca "$RUNNER_TEMP/papela-gate4-root.crt"
          docker compose -f docker-compose.prod.yml stop worker
          docker exec papela-gate4-ci-postgres-1 psql -X -q -U papela_owner -d papela \
            -c "INSERT INTO jobs (id,tenant_id,filename,storage_path,size_bytes,pages) VALUES ('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111','synthetic-pending.pdf','/data/pdfs/33333333-3333-4333-8333-333333333333.pdf',1,1)" >/dev/null
          output=$(docker compose -f docker-compose.prod.yml --profile ops run --rm backup backup)
          backup_id=$(printf '%s\n' "$output" | sed -n 's/^BACKUP_ID=//p')
          [[ "$backup_id" =~ ^backup-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]]
          metadata_generation=$(sudo python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["privacy_generation"])' "$PAPELA_BACKUP_DIR/$backup_id/metadata.json")
          database_generation=$(docker exec papela-gate4-ci-postgres-1 psql -X -Atq -U papela_owner -d papela -c 'SELECT generation FROM privacy_state WHERE singleton=TRUE')
          [[ "$metadata_generation" == "$database_generation" ]]
          # T0 archive predates these T1 erasures. The independent journal
          # must keep both job and tenant data unavailable after restore.
          uv run --no-sync python scripts/smoke_backup_restore.py erase \
            --state "$RUNNER_TEMP/gate6-jobs.json" --port 18443 \
            --ca "$RUNNER_TEMP/papela-gate4-root.crt"
          docker compose -f docker-compose.prod.yml run --rm --no-deps \
            -e PAPELA_ALLOW_PRIVACY_OPS=1 api python -m app.lifecycle offboard \
            --tenant 33333333-3333-4333-8333-333333333333 \
            --confirm-tenant 33333333-3333-4333-8333-333333333333 --execute
          docker compose -f docker-compose.prod.yml --profile ops run --rm backup verify "$backup_id"
          [[ "$(sudo stat -c '%a' "$PAPELA_BACKUP_DIR/$backup_id")" == 700 ]]
          for file in database.dump database.sha256 metadata.json; do
            [[ "$(sudo stat -c '%a' "$PAPELA_BACKUP_DIR/$backup_id/$file")" == 600 ]]
          done
          checksum_before=$(sudo sha256sum "$PAPELA_BACKUP_DIR/$backup_id/database.dump" | awk '{print $1}')
          tampered_id=backup-20000101T000000Z-deadbeef
          sudo cp -a "$PAPELA_BACKUP_DIR/$backup_id" "$PAPELA_BACKUP_DIR/$tampered_id"
          printf x | sudo tee -a "$PAPELA_BACKUP_DIR/$tampered_id/database.dump" >/dev/null
          if docker compose -f docker-compose.prod.yml --profile ops run --rm backup verify "$tampered_id"; then
            echo '::error::Corrupted backup was accepted'
            exit 1
          fi
          sudo rm -r -- "$PAPELA_BACKUP_DIR/$tampered_id"
          docker compose -f docker-compose.prod.yml --profile ops run --rm backup retention "$backup_id" 7
          aged_old=backup-20000103T000000Z-aaaaaaa1
          aged_keep=backup-20000104T000000Z-aaaaaaa2
          sudo cp -a "$PAPELA_BACKUP_DIR/$backup_id" "$PAPELA_BACKUP_DIR/$aged_old"
          sudo cp -a "$PAPELA_BACKUP_DIR/$backup_id" "$PAPELA_BACKUP_DIR/$aged_keep"
          sudo touch -d '45 days ago' "$PAPELA_BACKUP_DIR/$aged_old" "$PAPELA_BACKUP_DIR/$aged_keep"
          docker compose -f docker-compose.prod.yml --profile ops run --rm \
            -e PAPELA_BACKUP_RETENTION_DAYS=30 backup retention-age "$backup_id"
          [[ ! -e "$PAPELA_BACKUP_DIR/$aged_old" && -d "$PAPELA_BACKUP_DIR/$aged_keep" ]]
          sudo rm -r -- "$PAPELA_BACKUP_DIR/$aged_keep"
          if docker compose -f docker-compose.prod.yml --profile ops run --rm backup \
            restore-test "$backup_id" papela; then
            echo '::error::Restore accepted the source database as a target'
            exit 1
          fi
          # Only the explicitly named disposable target database is destroyed.
          docker exec papela-gate4-ci-postgres-1 createdb -U papela_owner papela_restore_gate6_ci
          docker exec papela-gate4-ci-postgres-1 psql -X -q -U papela_owner -d papela_restore_gate6_ci \
            -c 'CREATE TABLE restore_sentinel (id integer)' >/dev/null
          docker exec papela-gate4-ci-postgres-1 dropdb -U papela_owner papela_restore_gate6_ci
          docker exec papela-gate4-ci-postgres-1 createdb -U papela_owner papela_restore_gate6_ci
          docker compose -f docker-compose.prod.yml --profile ops run --rm backup \
            restore-test "$backup_id" papela_restore_gate6_ci
          [[ "$(docker exec papela-gate4-ci-postgres-1 psql -X -Atq -U papela_owner -d papela_restore_gate6_ci -c 'SELECT restore_ready FROM privacy_state')" == f ]]
          checksum_after=$(sudo sha256sum "$PAPELA_BACKUP_DIR/$backup_id/database.dump" | awk '{print $1}')
          [[ "$checksum_before" == "$checksum_after" ]]
          [[ "$(docker exec papela-gate4-ci-postgres-1 psql -X -Atq -U papela_owner -d papela_restore_gate6_ci -c 'SELECT count(DISTINCT tenant_id) FROM jobs')" == 3 ]]
          pending_reconciled=$(docker exec papela-gate4-ci-postgres-1 psql -X -Atq -U papela_owner -d papela_restore_gate6_ci \
            -c "SELECT count(*) FROM jobs WHERE status='failed' AND error='processing_error: RestoreRequiresResubmission'")
          [[ "$pending_reconciled" == 1 ]]
          docker compose -f docker-compose.prod.yml stop api worker
          sudo sed -i 's@/papela$@/papela_restore_gate6_ci@' "$PAPELA_DATABASE_URL_FILE"
          sudo chown 65532:65532 "$PAPELA_DATABASE_URL_FILE"
          sudo chmod 400 "$PAPELA_DATABASE_URL_FILE"
          docker compose -f docker-compose.prod.yml up --detach --force-recreate --no-deps api
          sleep 3
          if docker exec papela-gate4-ci-api-1 python -c 'import urllib.request; urllib.request.urlopen("http://localhost:8000/readiness", timeout=3)' >/dev/null 2>&1; then
            echo '::error::Restored database became ready before erasure reconciliation'
            exit 1
          fi
          docker compose -f docker-compose.prod.yml stop api
          docker compose -f docker-compose.prod.yml run --rm --no-deps \
            -e PAPELA_ALLOW_PRIVACY_OPS=1 api python -m app.lifecycle reconcile \
            --database papela_restore_gate6_ci \
            --confirm-database papela_restore_gate6_ci --execute
          docker compose -f docker-compose.prod.yml up --detach --force-recreate --wait --wait-timeout 120 api worker caddy
          uv run --no-sync python scripts/smoke_backup_restore.py verify \
            --state "$RUNNER_TEMP/gate6-jobs.json" --port 18443 \
            --ca "$RUNNER_TEMP/papela-gate4-root.crt" \
            --reconciled-job-id 33333333-3333-4333-8333-333333333333
          [[ "$(docker exec papela-gate4-ci-postgres-1 psql -X -Atq -U papela_owner -d papela_restore_gate6_ci -c "SELECT count(*) FROM jobs WHERE tenant_id='33333333-3333-4333-8333-333333333333'")" == 0 ]]

      - name: Remove Gate 4 synthetic stack and credentials
        if: ${{ always() }}
        run: |
          if [[ -f "$RUNNER_TEMP/papela-gate7-drill/.env.synthetic" ]]; then
            docker compose --project-name papela-gate7-ci \
              --env-file "$RUNNER_TEMP/papela-gate7-drill/.env.synthetic" \
              -f docker-compose.prod.yml down --volumes --remove-orphans
          fi
          if [[ -n "${PAPELA_PG_ADMIN_PASSWORD_FILE:-}" && -f docker-compose.prod.yml ]]; then
            docker compose -f docker-compose.prod.yml down --volumes --remove-orphans
          fi
          rm -f "$RUNNER_TEMP/papela-gate4-root.crt"
          rm -rf "$RUNNER_TEMP/papela-gate4-secrets"
          if [[ "${PAPELA_BACKUP_DIR:-}" == "$RUNNER_TEMP/papela-gate6-backups" ]]; then
            sudo rm -rf -- "$PAPELA_BACKUP_DIR"
          fi
          if [[ "${PAPELA_ERASURE_DIR:-}" == "$RUNNER_TEMP/papela-gate8-erasures" ]]; then
            sudo rm -r -- "$PAPELA_ERASURE_DIR"
          fi
          rm -f "$RUNNER_TEMP/gate6-jobs.json"

      - name: Remove isolated test containers and synthetic data
        if: ${{ always() }}
        run: |
          if [[ -f compose.gate1.yml ]]; then
            docker compose -f compose.gate1.yml down --volumes --remove-orphans
          fi
          rm -f "$RUNNER_TEMP/papela-gate3-runtime.tar" "$RUNNER_TEMP/papela-gate3-scan.json"

      # No artifact/image upload: installed runtime contains proprietary IP.
